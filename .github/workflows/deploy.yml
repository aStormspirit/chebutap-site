name: Site → Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Не заданы:$missing — публикация пропущена (см. README)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # foodfi.io обслуживает Cloudflare Worker со статическими файлами (не проект Pages).
      # Имя Worker'а берётся из переменной CF_PAGES_PROJECT (историческое имя).
      - name: Deploy to Cloudflare Worker (static assets)
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.153.0"
          command: deploy --name=${{ vars.CF_PAGES_PROJECT }} --assets=public --compatibility-date=2026-11-01

      - name: Smoke check
        if: steps.secrets.outputs.ready == 'true' && vars.SITE_URL != ''
        run: curl -fsS --retry 5 --retry-delay 5 -o /dev/null "${{ vars.SITE_URL }}"
